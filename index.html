<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 本机连不上 fonts.googleapis.com，而 kit/base.css 第一行 @import 了 Google 字体。
     那个请求会一直挂着 → 样式表永远"加载中" → 浏览器会连脚本执行一起挡住。
     这条 CSP 直接禁止外部样式，让那个 @import 立刻失败。 -->
<meta http-equiv="Content-Security-Policy" content="style-src 'self' 'unsafe-inline'; font-src 'self' data:">
<title>Movies · Cinema.Tickets</title>
<!-- UI kit：四个 CSS 顺序不能改，文件一个字都不要动 -->
<link rel="stylesheet" href="kit/tokens.css">
<link rel="stylesheet" href="kit/base.css">
<link rel="stylesheet" href="kit/layout.css">
<link rel="stylesheet" href="kit/components.css">
</head>
<body>
  <div class="l-page">

    <!-- ===== 页头（规格书 5.1）：游客版，登录后由 js/auth.js 替换用户区 ===== -->
    <header class="l-header">
      <div class="l-container c-header">
        <a class="c-header__logo" href="index.html"><svg class="c-icon c-icon--lg" aria-hidden="true"><use href="kit/icons.svg#icon-logo"></use></svg><span>Cinema.Tickets</span></a>
        <nav class="c-nav" aria-label="Main">
          <a class="c-nav__link" href="index.html" aria-current="page">Movies</a>
          <a class="c-nav__link" href="bookings.html">Bookings</a>
          <a class="c-nav__link" href="cart.html">Cart <span class="c-counter" hidden="hidden">0</span></a>
        </nav>
        <div class="c-header__user">
          <a class="c-btn c-btn--secondary c-btn--sm" href="login.html">Log in</a>
          <a class="c-btn c-btn--primary c-btn--sm" href="registration.html">Register</a>
        </div>
      </div>
    </header>

    <main class="l-main">
      <div class="l-container l-stack l-stack--lg">

        <!-- 地址栏参数非法时 JS 往这里放 alert -->
        <div id="page-alert" hidden></div>

        <div class="c-page-title">
          <div class="c-page-title__main">
            <h1>Movies</h1>
            <div class="c-page-title__subtitle" id="catalog-count"></div>
          </div>
        </div>

        <!-- 筛选表单：method="get"，所以不会带 page，提交后自然回到第 1 页 -->
        <form class="c-filter-bar" id="filter-form" method="get" action="index.html" aria-label="Filters">
          <div class="c-filter-bar__filters">

            <details class="c-multiselect">
              <summary class="c-multiselect__summary">
                <span class="c-multiselect__label">Genres</span>
                <span class="c-multiselect__control"><span class="c-multiselect__value">Any</span><svg class="c-icon c-icon--sm" aria-hidden="true"><use href="kit/icons.svg#icon-chevron-down"></use></svg></span>
              </summary>
              <div class="c-multiselect__panel">
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="genres" value="Action"><span class="c-check__box" aria-hidden="true"></span><span>Action</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="genres" value="Adventure"><span class="c-check__box" aria-hidden="true"></span><span>Adventure</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="genres" value="Animation"><span class="c-check__box" aria-hidden="true"></span><span>Animation</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="genres" value="Comedy"><span class="c-check__box" aria-hidden="true"></span><span>Comedy</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="genres" value="Crime"><span class="c-check__box" aria-hidden="true"></span><span>Crime</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="genres" value="Documentary"><span class="c-check__box" aria-hidden="true"></span><span>Documentary</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="genres" value="Drama"><span class="c-check__box" aria-hidden="true"></span><span>Drama</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="genres" value="Family"><span class="c-check__box" aria-hidden="true"></span><span>Family</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="genres" value="Fantasy"><span class="c-check__box" aria-hidden="true"></span><span>Fantasy</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="genres" value="Horror"><span class="c-check__box" aria-hidden="true"></span><span>Horror</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="genres" value="Romance"><span class="c-check__box" aria-hidden="true"></span><span>Romance</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="genres" value="SciFi"><span class="c-check__box" aria-hidden="true"></span><span>Sci-Fi</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="genres" value="Thriller"><span class="c-check__box" aria-hidden="true"></span><span>Thriller</span></label>
              </div>
            </details>

            <details class="c-multiselect">
              <summary class="c-multiselect__summary">
                <span class="c-multiselect__label">Age rating</span>
                <span class="c-multiselect__control"><span class="c-multiselect__value">Any</span><svg class="c-icon c-icon--sm" aria-hidden="true"><use href="kit/icons.svg#icon-chevron-down"></use></svg></span>
              </summary>
              <div class="c-multiselect__panel">
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="ageRatings" value="Age0"><span class="c-check__box" aria-hidden="true"></span><span>0+</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="ageRatings" value="Age6"><span class="c-check__box" aria-hidden="true"></span><span>6+</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="ageRatings" value="Age12"><span class="c-check__box" aria-hidden="true"></span><span>12+</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="ageRatings" value="Age16"><span class="c-check__box" aria-hidden="true"></span><span>16+</span></label>
                <label class="c-check c-multiselect__option"><input class="c-check__input" type="checkbox" name="ageRatings" value="Age18"><span class="c-check__box" aria-hidden="true"></span><span>18+</span></label>
              </div>
            </details>

            <div class="c-field">
              <label class="c-field__label" for="filter-date">Date</label>
              <select class="c-select" id="filter-date" name="date">
                <option value="" selected="selected">Any date</option>
              </select>
            </div>

            <div class="c-field">
              <label class="c-field__label" for="filter-sorting">Sort by</label>
              <select class="c-select" id="filter-sorting" name="sorting">
                <option value="TitleAsc" selected="selected">Title: A–Z</option>
                <option value="TitleDesc">Title: Z–A</option>
                <option value="RatingDesc">Rating: high to low</option>
                <option value="RatingAsc">Rating: low to high</option>
                <option value="ReleaseDateDesc">Release date: newest first</option>
                <option value="ReleaseDateAsc">Release date: oldest first</option>
              </select>
            </div>

            <div class="c-filter-bar__toggle">
              <label class="c-switch"><input class="c-switch__input" id="filter-now-showing" type="checkbox" role="switch" name="nowShowing" value="true"><span class="c-switch__track" aria-hidden="true"></span><span>Now showing only</span></label>
            </div>
          </div>

          <div class="c-filter-bar__actions">
            <button class="c-btn c-btn--primary" type="submit">Apply</button>
            <a class="c-btn c-btn--link" href="index.html">Reset</a>
          </div>
        </form>

        <!-- 影片卡片由 JS 渲染；加载时这里放 8 个骨架卡 -->
        <div class="l-grid l-grid--cols-4" id="movie-grid"></div>

        <!-- 空结果时放 c-empty -->
        <div id="empty-area"></div>

        <!-- 分页链接 -->
        <div id="pagination-area"></div>

      </div>
    </main>

    <footer class="l-footer">
      <div class="l-container c-footer">© 2026 Cinema.Tickets · Frontend study project</div>
    </footer>

  </div>
  <script type="module" src="js/pages/index.js"></script>
</body>
</html>
