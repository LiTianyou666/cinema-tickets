<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 本机连不上 fonts.googleapis.com，而 kit/base.css 第一行 @import 了 Google 字体。
     那个请求会一直挂着 → 样式表永远"加载中" → 浏览器会连脚本执行一起挡住
     （表现：按钮点不动、页面一直在加载）。
     这条 CSP 直接禁止外部样式，让那个 @import 立刻失败，页面就能正常跑。
     只限制样式来源，不影响接口请求和图片。 -->
<meta http-equiv="Content-Security-Policy" content="style-src 'self' 'unsafe-inline'; font-src 'self' data:">
<title>Profile · Cinema.Tickets</title>
<!-- UI kit：四个 CSS 顺序不能改，文件一个字都不要动 -->
<link rel="stylesheet" href="kit/tokens.css">
<link rel="stylesheet" href="kit/base.css">
<link rel="stylesheet" href="kit/layout.css">
<link rel="stylesheet" href="kit/components.css">
</head>
<body>
  <div class="l-page">

    <!-- ===== 页头（规格书 5.1） =====
         这里是【游客版】，登录后由 js/auth.js 的 initHeader() 换成
         【邮箱链接 + Log out 按钮】，并更新购物车计数器。 -->
    <header class="l-header">
      <div class="l-container c-header">
        <a class="c-header__logo" href="index.html"><svg class="c-icon c-icon--lg" aria-hidden="true"><use href="kit/icons.svg#icon-logo"></use></svg><span>Cinema.Tickets</span></a>
        <nav class="c-nav" aria-label="Main">
          <a class="c-nav__link" href="index.html">Movies</a>
          <a class="c-nav__link" href="bookings.html">Bookings</a>
          <a class="c-nav__link" href="cart.html">Cart <span class="c-counter" hidden="hidden">0</span></a>
        </nav>
        <div class="c-header__user">
          <a class="c-btn c-btn--secondary c-btn--sm" href="login.html">Log in</a>
          <a class="c-btn c-btn--primary c-btn--sm" href="registration.html">Register</a>
        </div>
      </div>
    </header>

    <main class="l-main">
      <div class="l-container l-stack l-stack--lg">
        <div class="l-narrow l-narrow--wide">
          <section class="c-card" aria-labelledby="form-title">
            <div class="c-card__header"><h1 class="c-card__title" id="form-title">Profile</h1></div>

            <form class="c-card__body" id="profile-form" method="post" novalidate="novalidate">

              <!-- 出错时 JS 往这里放 alert -->
              <div id="form-alert" hidden></div>

              <!-- Email 和 Gender 只读（c-static） -->
              <div>
                <div class="c-static"><span class="c-static__label">Email</span><span class="c-static__value" id="profile-email"></span></div>
                <div class="c-static"><span class="c-static__label">Gender</span><span class="c-static__value" id="profile-gender"></span></div>
              </div>

              <div class="c-field">
                <label class="c-field__label" for="profile-name">Full name</label>
                <input class="c-input" id="profile-name" type="text" name="fullName" autocomplete="name">
                <p class="c-field__error" id="profile-name-error" hidden><svg class="c-icon c-icon--sm" aria-hidden="true"><use href="kit/icons.svg#icon-error"></use></svg><span></span></p>
              </div>

              <div class="c-field">
                <label class="c-field__label" for="profile-birth">Date of birth</label>
                <input class="c-input" id="profile-birth" type="date" name="birthDate" autocomplete="bday">
                <p class="c-field__error" id="profile-birth-error" hidden><svg class="c-icon c-icon--sm" aria-hidden="true"><use href="kit/icons.svg#icon-error"></use></svg><span></span></p>
              </div>

              <div class="c-field">
                <label class="c-field__label" for="profile-phone">Phone number</label>
                <input class="c-input" id="profile-phone" type="tel" name="phoneNumber" autocomplete="tel" placeholder="+7 (___) ___-__-__" aria-describedby="profile-phone-hint">
                <p class="c-field__hint" id="profile-phone-hint">Format: +7 (xxx) xxx-xx-xx.</p>
                <p class="c-field__error" id="profile-phone-error" hidden><svg class="c-icon c-icon--sm" aria-hidden="true"><use href="kit/icons.svg#icon-error"></use></svg><span></span></p>
              </div>

              <!-- 按钮默认禁用，等 js/pages/profile.js 准备好再启用 -->
              <div class="l-cluster l-cluster--end"><button class="c-btn c-btn--primary" type="submit" id="profile-submit" disabled>Save changes</button></div>
            </form>
          </section>
        </div>
      </div>
    </main>

    <footer class="l-footer">
      <div class="l-container c-footer">© 2026 Cinema.Tickets · Frontend study project</div>
    </footer>

  </div>
  <script type="module" src="js/pages/profile.js"></script>
</body>
</html>
